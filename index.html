    h("div", { style: "width:34px;height:34px;border:4px solid #D9DEE8;border-top-color:#B8923A;border-radius:50%;margin:0 auto 16px;animation:gfspin 1s linear infinite" }),
    h("p", { id: "loadmsg", text: T("loading") })));
  if (!document.getElementById("gfspin")) { const st = document.createElement("style"); st.id = "gfspin"; st.textContent = "@keyframes gfspin{to{transform:rotate(360deg)}}"; document.head.append(st); }
  setTimeout(() => { const m = document.getElementById("loadmsg"); if (m) m.textContent = "Still waking up the server… the first load can take up to a minute. Please keep this page open."; }, 6000);
}

async function fetchConfig() {
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/|macros\/)s\/[^\/]+\/exec$/.test(API_URL.trim())) throw new Error("BADURL");
  let lastErr;
  for (let i = 0; i < 2; i++) {            // GET is harmless to repeat: one automatic retry
    try {
      const r = await fetchTimeout(API_URL.trim(), {}, 75000);
      const txt = await r.text();
      let j; try { j = JSON.parse(txt); } catch (x) { throw new Error("NOTJSON"); }
      if (!j.ok) throw new Error(j.error || "unavailable");
      return j.config;
    } catch (e) { lastErr = e; if (e.message === "BADURL" || e.message === "NOTJSON") break; }
  }
  throw lastErr;
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function renderBlocked() {
  view = "blocked"; clearDraft(); answers = {}; step = -1;
  app.replaceChildren(banner(cfg.settings), h("div", { class: "center" },
    h("h2", { text: T("blocked_title") }),
    h("p", { text: T("blocked_text") }),
    h("p", { class: "muted", style: "color:var(--muted);font-size:13px", text: T("blocked_close") })));
  window.scrollTo(0, 0);
}
function renderGate() {
  view = "gate"; const s = cfg.settings;
  app.replaceChildren(banner(s), h("div", { class: "center" },
    h("h2", { text: T("gate_title") }),
    h("p", { text: T("gate_text") }),
    h("div", { class: "nav", style: "justify-content:center;gap:12px;flex-wrap:wrap" },
      h("button", { class: "btn", onclick: () => { lsSet("gf_adult_ok", "1"); start(); } }, T("gate_yes")),
      h("button", { class: "btn ghost", onclick: () => { lsSet("gf_minor", "1"); renderBlocked(); } }, T("gate_no")))));
}
function footer() {
  const s = cfg.settings;
  return h("div", { class: "foot", style: "text-align:center;color:var(--muted);font-size:11px;padding:18px 12px 28px;line-height:1.5" },
    T("footer", { controller: s.controller || "", contact: s.contactEmail || "" }));
}
function start() {
  document.title = S("title");
  if (!cfg.open) return renderClosed();
  if (lsGet("gf_minor") === "1") return renderBlocked();
  if (!DEMO && lsGet("gf_adult_ok") !== "1") return renderGate();
  if (loadDraft() && step >= 0) { renderStep(); toast(T("restored")); } else if (step === -2) renderVersion(); else renderIntro();
}

function showError(e) {
  const hints = {
    BADURL: "Setup problem: API_URL is not a Google web-app link. It must start with https://script.google.com/macros/s/ and end with /exec.",
    NOTJSON: "Setup problem: Google returned a web page instead of data. In Apps Script, Deploy > Manage deployments: 'Who has access' must be 'Anyone', and use the link that ends in /exec.",
    TIMEOUT: "The server did not answer in time. Try again - the second attempt is usually much faster.",
  };
  const hint = hints[e.message] || (e.message === "Failed to fetch" ? "The browser could not reach the Google script (wrong link, no connection, or access not set to 'Anyone')." : "");
  app.replaceChildren(banner({ title: "Girlfriend Application Form", subtitle: "" }), h("div", { class: "center" },
    h("h2", { text: "The form is not available right now" }), h("p", { text: "Please check your connection and try again in a moment." }),
    hint ? h("p", { class: "muted", style: "color:var(--muted);font-size:13px;max-width:560px;margin:12px auto", text: hint }) : null,
    h("button", { class: "btn", onclick: () => { showLoading(); boot(); } }, "Try again")));
}

async function boot() {
  if (DEMO) { cfg = DEMO_CONFIG; return start(); }
  // 1) Wake the Google script in the background so it is warm by the time she submits. Never blocks the page.
  try { fetch(API_URL.trim(), { mode: "no-cors" }).catch(() => {}); } catch (e) {}
  // 2) The form itself comes from this website (instant): config.json if present, otherwise the built-in copy.
  try {
    const r = await fetchTimeout("config.json", { cache: "no-cache" }, 4000);
    if (r.ok) { const j = JSON.parse(await r.text()); cfg = j.config || j; }
  } catch (e) {}
  if (!cfg || !cfg.sections) cfg = DEMO_CONFIG;
  start();
}

function fetchTimeout(url, opts, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).catch(e => { throw e.name === "AbortError" ? new Error("TIMEOUT") : e; }).finally(() => clearTimeout(t));
}

function tnote() { return lang !== "en" ? h("div", { class: "tnote", role: "note", text: T("translation_note") }) : document.createDocumentFragment(); }
function banner(s) {
  const live = cfg && s === cfg.settings;
  return h("div", {}, DEMO ? h("div", { class: "demo" }, "DEMO MODE - nothing is sent anywhere. Set API_URL to go live.") : null,
    h("div", { class: "banner" }, h("div", { class: "kicker" }, T("kicker")),
      h("h1", { text: live ? S("title") : s.title }), h("div", { class: "sub", text: live ? S("subtitle") : s.subtitle })),
    tnote());
}

function renderClosed() {
  view = "closed";
  app.replaceChildren(banner(cfg.settings), h("div", { class: "center" }, h("h2", { text: T("closed_title") }), h("p", { text: T("closed_text") })));
}

function renderIntro() {
  view = "intro"; const s = cfg.settings;
  const cb = h("input", { type: "checkbox", id: "consent", checked: consent, onchange: e => { consent = e.target.checked; go.disabled = !consent; saveDraft(); } });
  const go = h("button", { class: "btn", disabled: !consent, onclick: () => { if (quickAvailable()) { step = -2; saveDraft(); renderVersion(); } else { version = "full"; step = 0; saveDraft(); renderStep(); } } }, T("start"));
  app.replaceChildren(banner(s), h("div", { class: "pad" },
    h("dl", { class: "info" },
      h("dt", {}, T("info_position")), h("dd", { text: S("position") }), h("dt", {}, T("info_department")), h("dd", { text: S("department") }),
      h("dt", {}, T("info_contract")), h("dd", { text: S("contract") }), h("dt", {}, T("info_fee")), h("dd", { text: S("fee") })),
    h("div", { class: "notice" }, h("b", {}, T("before_start")), S("notice")),
    h("div", { class: "notice", style: "background:var(--paper)" }, h("b", {}, T("legal_title")),
      h("ul", { style: "margin:8px 0 0 18px;padding:0" }, (S("legalNote") || "").split("\n").filter(x => x.trim()).map(line => {
        const m = line.match(/^(.{1,40}?[:\uFF1A])\s*/); return h("li", { style: "margin:5px 0" }, m ? [h("b", { text: m[1] }), " " + line.slice(m[0].length)] : line); }))),
    h("label", { class: "consent" }, cb, h("span", { text: S("consentText") })),
    go), footer());
  window.scrollTo(0, 0);
}

function renderVersion() {
  view = "version"; const full = cfg.sections, quick = (() => { const v = version; version = "quick"; const r = secs(); version = v; return r; })();
  const card = (key, title, list, desc) => h("button", { type: "button", class: "vcard", onclick: () => { version = key; step = 0; saveDraft(); renderStep(); } },
    h("div", { class: "vt", text: title }), h("div", { class: "vm", text: T("about_min", { n: minutesFor(list) }) }),
    h("div", { class: "vq", text: T("n_questions", { n: countQ(list) }) }), h("div", { class: "vd", text: desc }));
  app.replaceChildren(banner(cfg.settings), h("div", { class: "pad" },
    h("div", { class: "sec" }, h("h2", { text: T("version_title") })),
    h("p", { text: T("version_text") }),
    h("div", { class: "vcards" },
      card("quick", T("quick_title"), quick, T("quick_desc")),
      card("full", T("full_title"), full, T("full_desc"))),
    h("div", { class: "nav" }, h("button", { class: "btn ghost", onclick: () => { step = -1; saveDraft(); renderIntro(); } }, T("back")))), footer());
  window.scrollTo(0, 0);
}

function opt(q, type, value, name, shown) {
  const cur = answers[q.id];
  const on = type === "radio" ? cur === value : Array.isArray(cur) && cur.includes(value);
  const input = h("input", { type, name, value, checked: on });
  const lab = h("label", { class: "opt" + (on ? " on" : "") }, input, h("span", { text: shown || value }));
  input.addEventListener("change", () => {
    if (type === "radio") { answers[q.id] = value; lab.parentNode.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === lab)); }
    else {
      const set = new Set(answers[q.id] || []); input.checked ? set.add(value) : set.delete(value);
      answers[q.id] = q.options.filter(o => set.has(o)); lab.classList.toggle("on", input.checked);
    }
    lab.closest(".q").classList.remove("invalid"); saveDraft();
  });
  return lab;
}

function field(q) {
  const wrap = h("div", { class: "q " + (q.type === "rating" ? "half" : q.type === "long" || q.type === "choice" || q.type === "multi" ? "" : q.width || ""), "data-id": q.id, "data-req": T("required") });
  const lab = h("div", { class: "l" }, ql(q), q.required ? h("span", { class: "req", "aria-hidden": "true" }, " *") : null);
  if (q.type === "short") {
    const id = "f_" + q.id; wrap.append(h("label", { class: "l", for: id }, ql(q), q.required ? h("span", { class: "req" }, " *") : null));
    const max = q.maxLen || 300, cnt = h("div", { class: "cnt", hidden: true });
    const upd = n => { cnt.textContent = n + " / " + max; cnt.hidden = n < max * 0.8; cnt.classList.toggle("warn", n >= max); };
    wrap.append(h("input", { type: "text", id, maxlength: max, value: answers[q.id] || "", autocomplete: "off",
      oninput: e => { answers[q.id] = e.target.value; upd(e.target.value.length); wrap.classList.remove("invalid"); saveDraft(); } }), cnt);
    upd((answers[q.id] || "").length);
  } else if (q.type === "long") {
    const id = "f_" + q.id; wrap.append(h("label", { class: "l", for: id }, ql(q), q.required ? h("span", { class: "req" }, " *") : null));
    const max = q.maxLen || 1000, cnt = h("div", { class: "cnt" });
    const upd = n => { cnt.textContent = n + " / " + max; cnt.classList.toggle("warn", n >= max); };
    const t = h("textarea", { id, rows: q.rows || 3, maxlength: max, oninput: e => { answers[q.id] = e.target.value; upd(e.target.value.length); wrap.classList.remove("invalid"); saveDraft(); } });
    t.value = answers[q.id] || ""; wrap.append(t, cnt); upd(t.value.length);
  } else if (q.type === "choice" || q.type === "multi") {
    const type = q.type === "choice" ? "radio" : "checkbox";
    wrap.setAttribute("role", type === "radio" ? "radiogroup" : "group"); wrap.setAttribute("aria-label", ql(q));
    wrap.append(lab, h("div", { class: "opts" }, q.options.map((o, i) => opt(q, type, o, "n_" + q.id, qo(q, i)))));
  } else if (q.type === "rating") {
    wrap.append(lab);
    const r = h("div", { class: "rate", role: "radiogroup", "aria-label": ql(q) });
    for (let i = 1; i <= 10; i++) {
      const input = h("input", { type: "radio", name: "n_" + q.id, value: i, checked: answers[q.id] === i });
      const l = h("label", { class: answers[q.id] === i ? "on" : "" }, input, String(i));
      input.addEventListener("change", () => { answers[q.id] = i; r.querySelectorAll("label").forEach(x => x.classList.toggle("on", x === l)); wrap.classList.remove("invalid"); saveDraft(); });
      r.append(l);
    }
    wrap.append(r, h("div", { class: "rate-hint" }, h("span", { text: T("rate_low") }), h("span", { text: T("rate_high") })));
  } else if (q.type === "note") {
    return h("div", { class: "note", text: ql(q) });
  }
  return wrap;
}

function topbar() {
  const total = secs().length + 1;
  const done = Math.max(0, step);
  const name = step < secs().length ? st(secs()[step].title) : T("final_step");
  return h("div", { class: "topbar" }, h("div", { class: "row" }, h("span", { text: T("section_of", { n: Math.min(step + 1, total), m: total }) }),
    h("span", { text: name })), h("div", { class: "bar" }, h("i", { style: "width:" + Math.round(done / total * 100) + "%" })));
}

function renderStep() {
  if (step >= secs().length) return renderFinal();
  view = "step"; const sec = secs()[step];
  const grid = h("div", { class: "grid" }, sec.questions.map(field));
  const err = h("div", { class: "msg", role: "alert", hidden: true });
  const next = h("button", { class: "btn", onclick: () => {
    const miss = missing(sec);
    if (miss.length) { err.hidden = false; err.textContent = T("fix_fields", { n: miss.length }); mark(sec, miss); return; }
    const aq = sec.questions.find(q => q.id === cfg.settings.ageQuestionId);
    if (aq) {
      const n = parseInt(String(answers[aq.id]).replace(/[^0-9]/g, " ").trim().split(/\s+/)[0], 10);
      if (isNaN(n)) { err.hidden = false; err.textContent = T("age_number"); mark(sec, [aq.id]); return; }
      if (n < 18) { lsSet("gf_minor", "1"); return renderBlocked(); }
    }
    step++; saveDraft(); renderStep();
  } }, T("next"));
  const back = h("button", { class: "btn ghost", onclick: () => { if (step === 0) { if (quickAvailable()) { step = -2; saveDraft(); renderVersion(); } else { step = -1; renderIntro(); } } else { step--; saveDraft(); renderStep(); } } }, T("back"));
  app.replaceChildren(topbar(), tnote(), h("div", { class: "pad" },
    h("div", { class: "sec" }, h("div", { class: "no", text: String(step + 1).padStart(2, "0") }), h("h2", { text: st(sec.title), tabindex: "-1", id: "sectitle" })),
    grid, err, h("div", { class: "nav" }, back, next)));
  window.scrollTo(0, 0);
}

function isEmpty(q) {
  const a = answers[q.id];
  if (q.type === "multi") return !(Array.isArray(a) && a.length);
  if (q.type === "short" || q.type === "long") return !(a && String(a).trim());
  return a === undefined || a === null || a === "";
}
function missing(sec) { return sec.questions.filter(q => q.required && q.type !== "note" && isEmpty(q)).map(q => q.id); }
function mark(sec, ids) {
  document.querySelectorAll(".q").forEach(el => el.classList.toggle("invalid", ids.includes(el.dataset.id)));
  const first = document.querySelector(".q.invalid"); if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderFinal() {
  view = "final"; const s = cfg.settings;
  const err = h("div", { class: "msg", role: "alert", hidden: true });
  const hp = h("input", { type: "text", name: "website", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" });
  const send = h("button", { class: "btn", onclick: () => submit(send, err, hp) }, T("submit"));
  const back = h("button", { class: "btn ghost", onclick: () => { step = secs().length - 1; saveDraft(); renderStep(); } }, T("back"));
  app.replaceChildren(topbar(), tnote(), h("div", { class: "pad" },
    h("div", { class: "sec" }, h("div", { class: "no", text: "!" }), h("h2", { text: T("final_step"), tabindex: "-1" })),
    h("div", { class: "block" }, h("h3", { text: T("important_title") }), h("p", { text: S("importantNotice") }),
      h("h3", { text: T("probation_title") }), h("p", { text: S("probation") })),
    h("div", { class: "hp" }, hp), err, h("div", { class: "nav" }, back, send)), footer());
  window.scrollTo(0, 0);
}

async function submit(btn, err, hp) {
  err.hidden = true; btn.disabled = true; btn.textContent = T("sending"); sending = true;
  // re-check all sections
  for (let i = 0; i < secs().length; i++) {
    const miss = missing(secs()[i]);
    if (miss.length) { step = i; saveDraft(); renderStep(); const e2 = document.querySelector(".msg"); e2.hidden = false; e2.textContent = T("fix_fields", { n: miss.length }); mark(secs()[i], miss); sending = false; return; }
  }
  try {
    let res;
    if (DEMO) { await new Promise(r => setTimeout(r, 700)); res = { ok: true, ref: "GF-DEMO-" + Math.random().toString(36).slice(2, 7).toUpperCase() }; }
    else {
      const r = await fetchTimeout(API_URL.trim(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ answers, adult: true, version: version || "full", lang, hp: hp.value, secs: Math.round((Date.now() - startedAt) / 1000) }) }, 90000);
      res = JSON.parse(await r.text());
    }
    if (!res.ok) { const x = new Error(res.error || ""); x.code = res.code || ""; throw x; }
    sending = false; clearDraft(); renderThanks(res.ref);
  } catch (e) {
    sending = false;
    if (e && e.code === "age") { lsSet("gf_minor", "1"); return renderBlocked(); }
    const known = { adult: "err_adult", closed: "err_closed", busy: "err_busy", rate: "err_rate", missing: "err_missing", toolong: "err_toolong", agenum: "age_number", generic: "err_generic" };
    const net = !e || e.message === "Failed to fetch" || e.message === "TIMEOUT" || e instanceof SyntaxError || !e.code && !e.message;
    const msg = e && e.code && known[e.code] ? T(known[e.code]) : (net ? T("err_server") : (e.message || T("err_send")));
    err.hidden = false; err.textContent = msg + " " + (e && e.code === "toolong" ? "" : T("err_keep"));
    btn.disabled = false; btn.textContent = T("submit");
  }
}

function renderThanks(ref) {
  view = "thanks"; lastRef = ref; const s = cfg.settings;
  app.replaceChildren(banner(s), h("div", { class: "center" }, h("h2", { text: S("thanksTitle") }), h("p", { text: S("thanksText") }),
    h("div", {}, T("thanks_ref") + " ", h("span", { class: "ref", text: ref })),
    h("p", { class: "muted", style: "color:var(--muted);font-size:12px;margin-top:14px", text: T("thanks_contact", { contact: s.contactEmail || "-" }) })));
  window.scrollTo(0, 0);
}

function toast(t) {
  const el = h("div", { class: "notice", style: "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:420px;z-index:9;margin:0" }, t);
  document.body.append(el); setTimeout(() => el.remove(), 3500);
}
mountThemeButton();
boot();
</script>
